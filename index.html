<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width-device-width, initial-scale1.0">
        <title>Ayumi Khanal</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 text-gray-800">
        <header class="bg-pink-800"></header> 
        <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
            <h1 class="text-2xl font-bold">Ayumi</h1>
            <nav class="space-x-4">
                <a href="#home" class="hover:underline">Home</a>
                <a href="#services" class="hover:underline">Services</a>
                <a href="#contact"class="hover:underline">Contact</a>
            </nav>
        </div>
    </header>
    <section id="home" class="text-center py-20 bg-pink-300">
        <h2 class="text-5xl font bold mb-4">Hello, I'm Ayumi Khanal</h2>
        <p class="text-lg mb-6">Bsc.CSIT Student | Web Learner</p>
    </section>
    <section id="services" class="py-16">
        <h2 class="text-3xl font bold text_center mb-10">My services</h2>
         <div class="max-w-6xl mx-auto grid grid-cols-2 gap-5 px-4">
            <div class="bg-white p-6 rounded shadow">
                <h3 class="text-xl font-semibold mb-2">Web Design</h3>
                <p>Simple and responsive website design using HTML and Tailwindcss.</p>
            </div>
        <div class="bg-white p-6 rounded shadow">
            <h3 class="text-xl font-semibold mb-2">Frontend Development</h3>
            <p>Building clean UI with modern frontend tools.</p>
        </div>
    </div>
    </section>
    <section id="contact" class="bg-gray py-16">
    <h2 class="text-3xl font-bold text-center mb-8">Contact Me</h2>

    <div class="max-w-md mx-auto px-4">
      <form class="space-y-4">
        <input type="text" placeholder="Your Name"
          class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">

        <input type="email" placeholder="Your Email"
          class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">

        <textarea placeholder="Your Message"
          class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>

        <button class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Send Message</button>
      </form>
    </div>
    </section>
    <footer class="bg-blue-600 text-white text-center py-4">
        <p> 2025 Ayumi |All Rights Reserved</p>
    </footer>
    </body>
</html>
